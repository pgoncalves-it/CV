name: Mise a jour de la carte LinkedIn
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  carte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y fonts-dejavu-core && pip install pillow qrcode
      - run: python carte.py
      - run: |
          git config user.name "carte-bot"
          git config user.email "bot@users.noreply.github.com"
          git add image-linkedin-cv.png
          git diff --cached --quiet || (git commit -m "Mise a jour de la carte" && git push)
